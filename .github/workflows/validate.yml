name: Validate shaders
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      EGL_PLATFORM: surfaceless
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make python3 libegl1 libgl1 libgl1-mesa-dri
      - name: Verify generated files and compare against VBA-M
        run: make verify
      - name: Package shaders only
        run: make package-test
      - uses: actions/upload-artifact@v4
        with:
          name: mgba-hqx-shaders-installable
          path: |
            dist/mgba-hqx-shaders.zip
            dist/SHA256SUMS
